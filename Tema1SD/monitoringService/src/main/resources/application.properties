spring.application.name=monitoringService
server.port=8084

# Database Configuration (Defaults for local run, overridden by Docker)
spring.datasource.url=jdbc:mysql://localhost:3311/monitoring_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=monitoring_user
spring.datasource.password=monitoring_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
